<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyrath – Deník postav</title><style>
*{box-sizing:border-box}body{margin:0;background:#111419;color:#e9e3d7;font:16px system-ui,sans-serif}header{padding:24px 5%;border-bottom:1px solid #54462f;background:#191c22}h1,h2,h3{font-family:Georgia,serif;color:#d8b679}h1{margin:0;letter-spacing:5px}small{color:#b1a99a}main{max-width:1100px;margin:auto;padding:24px;display:grid;grid-template-columns:240px 1fr;gap:20px}aside,article,.panel{background:#1b2027;border:1px solid #3d3b35;border-radius:12px;padding:18px}button,input,textarea{font:inherit;border:1px solid #595143;border-radius:7px;padding:10px;background:#101319;color:#eee}button{cursor:pointer;background:#30291f;color:#e8c88d}button:hover,button.active{background:#695332;color:white}input,textarea{width:100%}textarea{min-height:110px}label{display:block;color:#bcb3a2;font-size:13px;margin-bottom:5px}.field{margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.tabs,.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.line input{flex:1;min-width:100px}.line button{flex-shrink:0}.person{display:block;width:100%;text-align:left;margin:8px 0}.bar{height:9px;background:#30353d;border-radius:8px;overflow:hidden}.bar div{height:100%;background:#ae6660}hr{border:0;border-top:1px solid #454039} .muted{color:#b1a99a} .danger{color:#eaa29a} @media(max-width:700px){main{grid-template-columns:1fr;padding:12px}header{padding:18px}aside,article{padding:12px}}</style></head><body><header><h1>VEY RATH</h1><small>Digitální deník postav · verze 0.1</small></header><main><aside><h2>Družina</h2><button id="add">+ Nová postava</button><div id="people"></div><hr><small>Data jsou zatím pouze v tomto prohlížeči.</small><p><button id="backup">Export zálohy</button></p><label>Obnovit ze zálohy<input type="file" id="import" accept=".json,application/json"></label></aside><article id="detail"></article></main><script>
const key='veyrath-v1';const fresh=()=>({id:crypto.randomUUID(),name:'Nová postava',race:'',role:'',age:'',height:'',story:'',hp:10,maxhp:10,energy:0,maxenergy:0,xp:0,gold:0,defense:0,attack:0,attrs:[],skills:[],abilities:[],magic:[],jobs:[],items:[],notes:''});let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}if(!Array.isArray(state)){state=[{...fresh(),name:'Horus',race:'Člověk',role:'Božský válečník',height:'220 cm'},{...fresh(),name:'Nekromant',race:'Člověk',role:'Modifikace kostlivců'}]}let selected=state[0]?.id,tab='Profil';const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('Uložení se nezdařilo. Exportuj zálohu.')}}function el(tag,txt,parent){let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(parent)parent.append(n);return n}function btn(t,p,fn){let b=el('button',t,p);b.onclick=fn;return b}function field(p,c,k,label,type='text'){let w=el('div',undefined,p);w.className='field';el('label',label,w);let i=el(type==='area'?'textarea':'input',undefined,w);if(type!=='area')i.type=type;i.value=c[k]??'';i.oninput=()=>{c[k]=type==='number'?Number(i.value):i.value;save();if(k==='name')people()};return i}function grid(p){let g=el('div',undefined,p);g.className='grid';return g}function people(){let p=$('people');p.replaceChildren();state.forEach(c=>{let b=btn(c.name||'Bez názvu',p,()=>{selected=c.id;tab='Profil';render()});b.className='person'+(selected===c.id?' active':'')})}function collection(p,c,k,title,valueLabel){el('h3',title,p);c[k].forEach((entry,i)=>{let r=el('div',undefined,p);r.className='line';let a=el('input',undefined,r);a.placeholder='Název';a.value=entry.name;a.oninput=()=>{entry.name=a.value;save()};let v=el('input',undefined,r);v.placeholder=valueLabel;v.value=entry.value;v.oninput=()=>{entry.value=v.value;save()};btn('−',r,()=>{c[k].splice(i,1);save();render()})});btn('+ Přidat',p,()=>{c[k].push({name:'',value:''});save();render()})}function meter(p,c,k,m,label){let w=el('div',undefined,p);el('h3',label,w);let r=el('div',undefined,w);r.className='line';btn('−',r,()=>{c[k]=Math.max(0,c[k]-1);save();render()});el('strong',`${c[k]} / ${c[m]}`,r);btn('+',r,()=>{c[k]=Math.min(c[m],c[k]+1);save();render()});let bar=el('div',undefined,w);bar.className='bar';el('div',undefined,bar).style.width=Math.max(0,Math.min(100,c[k]/Math.max(1,c[m])*100))+'%';let input=field(w,c,m,'Maximum','number');input.min=0;input.onchange=()=>{c[m]=Math.max(0,c[m]);c[k]=Math.min(c[k],c[m]);save();render()}}function render(){people();let p=$('detail');p.replaceChildren();let c=state.find(x=>x.id===selected);if(!c){el('h2','Vytvoř svou první postavu',p);return}el('h2',c.name,p);el('small',[c.race,c.role].filter(Boolean).join(' · '),p);let tabs=el('div',undefined,p);tabs.className='tabs';['Profil','Atributy','Boj','Skilly','Schopnosti','Magie','Povolání','Inventář','Deník','Kostky'].forEach(t=>{let b=btn(t,tabs,()=>{tab=t;render()});if(t===tab)b.className='active'});el('hr',undefined,p);if(tab==='Profil'){let g=grid(p);[['name','Jméno'],['race','Rasa'],['role','Zaměření'],['age','Věk'],['height','Výška']].forEach(([k,l])=>field(g,c,k,l));field(p,c,'story','Příběh a vzhled','area');let b=btn('Smazat postavu',p,()=>{if(confirm('Opravdu smazat postavu?')){state=state.filter(x=>x!==c);selected=state[0]?.id;save();render()}});b.className='danger'}else if(tab==='Atributy'){collection(p,c,'attrs','Vlastní atributy','Hodnota')}else if(tab==='Boj'){let g=grid(p);meter(g,c,'hp','maxhp','Životy');meter(g,c,'energy','maxenergy','Energie');field(g,c,'defense','Obrana','number');field(g,c,'attack','Útok','number');field(g,c,'xp','Zkušenosti','number')}else if(tab==='Skilly')collection(p,c,'skills','Skilly','Úroveň / popis');else if(tab==='Schopnosti')collection(p,c,'abilities','Schopnosti','Efekt / popis');else if(tab==='Magie')collection(p,c,'magic','Kouzla','Efekt / náklady');else if(tab==='Povolání')collection(p,c,'jobs','Odborná povolání','Úroveň / specializace');else if(tab==='Inventář'){field(p,c,'gold','Zlaťáky','number');collection(p,c,'items','Předměty','Počet / popis')}else if(tab==='Deník')field(p,c,'notes','Poznámky z dobrodružství','area');else{let r=el('div',undefined,p);r.className='tabs';let out=el('h2','Vyber kostku',p);[4,6,8,10,12,20,100].forEach(n=>btn('k'+n,r,()=>{out.textContent='k'+n+': '+(1+Math.floor(Math.random()*n))}))}}$('add').onclick=()=>{let c=fresh();state.push(c);selected=c.id;tab='Profil';save();render()};$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='veyrath-zaloha.json';a.click();URL.revokeObjectURL(a.href)};$('import').onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a)||!a.every(x=>x&&typeof x.name==='string'&&['attrs','skills','abilities','magic','jobs','items'].every(k=>Array.isArray(x[k])&&x[k].every(y=>y&&typeof y.name==='string'&&typeof y.value==='string'))))throw Error();if(confirm('Nahradit současné postavy zálohou?')){state=a.map(x=>({...fresh(),...x,id:crypto.randomUUID()}));selected=state[0]?.id;save();render()}}catch{alert('Neplatná záloha.')}e.target.value=''};save();render();</script></body></html>
