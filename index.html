<!DOCTYPE html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyrath – Deník postav</title><style>
*{box-sizing:border-box}body{margin:0;background:#111419;color:#e9e3d7;font:16px system-ui,sans-serif}header{padding:24px 5%;border-bottom:1px solid #54462f;background:#191c22}h1,h2,h3{font-family:Georgia,serif;color:#d8b679}h1{margin:0;letter-spacing:5px}small{color:#b1a99a}main{max-width:1100px;margin:auto;padding:24px;display:grid;grid-template-columns:240px 1fr;gap:20px}aside,article,.panel{background:#1b2027;border:1px solid #3d3b35;border-radius:12px;padding:18px}button,input,textarea{font:inherit;border:1px solid #595143;border-radius:7px;padding:10px;background:#101319;color:#eee}button{cursor:pointer;background:#30291f;color:#e8c88d}button:hover,button.active{background:#695332;color:white}input,textarea{width:100%}textarea{min-height:110px}label{display:block;color:#bcb3a2;font-size:13px;margin-bottom:5px}.field{margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.tabs,.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.line input{flex:1;min-width:100px}.line button{flex-shrink:0}.person{display:block;width:100%;text-align:left;margin:8px 0}.bar{height:9px;background:#30353d;border-radius:8px;overflow:hidden}.bar div{height:100%;background:#ae6660}hr{border:0;border-top:1px solid #454039} .muted{color:#b1a99a} .danger{color:#eaa29a} @media(max-width:700px){main{grid-template-columns:1fr;padding:12px}header{padding:18px}aside,article{padding:12px}}[hidden]{display:none!important}button:disabled{opacity:.5;cursor:default}#auth label{margin:12px 0}#sync{overflow-wrap:anywhere}select{font:inherit;width:100%;padding:10px;border:1px solid #595143;border-radius:7px;background:#101319;color:#eee}.rule-card{border:1px solid #454039;padding:14px;margin:12px 0;border-radius:8px}.rule-card h3{margin:0 0 6px}.rule-text{white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere} </style></head><body><header><h1>VEY RATH</h1><small>Digitální deník postav · verze 0.5</small></header><section id="auth" class="panel" style="max-width:460px;margin:24px auto"><h2>Přihlášení do Veyrath</h2><form id="loginform"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Heslo<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><div class="tabs"><button id="login" type="submit">Přihlásit se</button><button id="register" type="button">Registrovat se</button></div></form><p id="authmsg" role="status"></p></section><main id="workspace" hidden><aside><h2 id="sideTitle">Moje postavy</h2><p id="adminControls" hidden><button id="adminToggle">Administrace PJ</button></p><small id="adminInfo" hidden>Režim PJ: všechny postavy. Cizí postavy lze upravit, nikoli smazat.</small><p><button id="libraryToggle">Knihovna pravidel</button></p><button id="add">+ Nová postava</button><div id="people"></div><hr><small><span id="account"></span><br><span id="sync" role="status"></span></small><p><button id="retry">Uložit / opakovat</button> <button id="refresh">Načíst online</button></p><p><button id="migrate">Přenést staré lokální postavy</button></p><p><button id="logout">Odhlásit se</button></p><p><button id="backup">Export zálohy</button></p><label>Obnovit ze zálohy<input type="file" id="import" accept=".json,application/json"></label></aside><article id="detail"></article><article id="library" hidden></article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const key='veyrath-v1';const fresh=()=>({id:crypto.randomUUID(),name:'Nová postava',race:'',role:'',age:'',height:'',story:'',hp:10,maxhp:10,energy:0,maxenergy:0,xp:0,gold:0,defense:0,attack:0,attrs:[],skills:[],abilities:[],magic:[],jobs:[],items:[],notes:''});let state=[],selected,tab='Profil';const $=id=>document.getElementById(id);
const db=window.supabase?.createClient('https://tdmwqkrilpeqmlvhgqiy.supabase.co','sb_publishable_3ey_cV_ZVh_vV3wX8laWcg_Y-HDwv3D');
let isAdmin=false, adminMode=false, owners=new Map();
let user=null, baseline=new Map(),timer=null,running=null,dirty=false,ready=false;
const status=t=>{$('sync').textContent=t};
function save(){if(!ready)return;dirty=true;status('Neuložené změny…');clearTimeout(timer);timer=setTimeout(flush,450)}
async function flush(){clearTimeout(timer);if(!ready)return false;if(running){const ok=await running;return ok?(dirty?flush():true):false}if(!dirty)return true;const uid=user.id;const snapshot=JSON.parse(JSON.stringify(state));dirty=false;running=(async()=>{try{const ids=new Set(snapshot.map(c=>c.id));for(const c of snapshot){const json=JSON.stringify(c);if(baseline.get(c.id)===json)continue;const payload={name:c.name,data:c,updated_at:new Date().toISOString()};const owner=owners.get(c.id);let result;if(owner){result=await db.from('characters').update(payload).eq('id',c.id).eq('owner_id',owner).select('id').single()}else{if(adminMode)throw Error('V režimu PJ nelze vytvářet postavy.');result=await db.from('characters').insert({id:c.id,owner_id:uid,...payload}).select('id').single()}if(result.error)throw result.error;owners.set(c.id,owner||uid);baseline.set(c.id,json)}for(const id of [...baseline.keys()]){if(ids.has(id))continue;if(adminMode||owners.get(id)!==uid)throw Error('Mazání v režimu PJ není povoleno.');const {error}=await db.from('characters').delete().eq('id',id).eq('owner_id',uid).select('id').single();if(error)throw error;baseline.delete(id);owners.delete(id)}status(dirty?'Neuložené změny…':'Uloženo online');return true}catch(e){dirty=true;status('Uložení selhalo: '+e.message+' – zkus znovu nebo exportuj zálohu.');return false}})();const ok=await running;running=null;if(ok&&dirty)return flush();return ok}

async function load(){ready=false;$('workspace').inert=true;status('Načítám…');try{let query=db.from('characters').select('id,owner_id,name,data');if(!adminMode)query=query.eq('owner_id',user.id);const {data,error}=await query.order('name');if(error)throw error;owners=new Map(data.map(r=>[r.id,r.owner_id]));state=data.map(r=>normalize({...r.data,id:r.id,name:r.name}));baseline=new Map(state.map(c=>[c.id,JSON.stringify(c)]));dirty=false;selected=state.find(c=>c.id===selected)?.id||state[0]?.id;render();ready=true;status('Uloženo online');return true}catch(e){state=[];selected=null;baseline.clear();owners.clear();render();status('Načtení selhalo: '+e.message);return false}finally{$('workspace').inert=false}}
function modeUI(){ $('adminControls').hidden=!isAdmin;$('adminInfo').hidden=!adminMode;$('adminToggle').textContent=adminMode?'Zpět na moje postavy':'Administrace PJ';$('sideTitle').textContent=adminMode?'Všechny postavy':'Moje postavy';for(const id of ['add','migrate','backup','import'])$(''+id).hidden=adminMode;$('import').parentElement.hidden=adminMode; }
async function enter(u){closeLibrary();user=u;isAdmin=false;adminMode=false;$('auth').hidden=true;$('workspace').hidden=false;$('account').textContent=u.email;try{const {data,error}=await db.from('admins').select('user_id').eq('user_id',u.id).maybeSingle();if(error)throw error;isAdmin=!!data}catch(e){console.warn('Kontrola PJ:',e.message)}modeUI();await load()}
$('adminToggle').onclick=async()=>{if(!isAdmin)return;$('adminToggle').disabled=true;$('workspace').inert=true;try{if(ready&&!await flush())return;closeLibrary();adminMode=!adminMode;selected=null;tab='Profil';state=[];baseline.clear();owners.clear();render();modeUI();await load()}finally{$('adminToggle').disabled=false;$('workspace').inert=false}};
async function authAction(register){if(!$('loginform').reportValidity())return;$('login').disabled=$('register').disabled=true;$('authmsg').textContent='Připojuji…';try{const email=$('email').value.trim(),password=$('password').value;const result=register?await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await db.auth.signInWithPassword({email,password});if(result.error)throw result.error;$('password').value='';if(result.data.session)await enter(result.data.session.user);else $('authmsg').textContent='Zkontroluj e-mail a potvrď registraci. Poté se přihlas.'}catch(e){$('authmsg').textContent=e.message}finally{$('login').disabled=$('register').disabled=false}}
$('loginform').onsubmit=e=>{e.preventDefault();authAction(false)};$('register').onclick=()=>authAction(true);

$('migrate').onclick=()=>{if(!ready||adminMode)return;try{const old=JSON.parse(localStorage.getItem(key));if(!Array.isArray(old)||!old.length){alert('Žádné původní lokální postavy nebyly nalezeny.');return}if(!confirm('Přidat kopie '+old.length+' lokálních postav k tomuto účtu? Opakování vytvoří další kopie.'))return;state.push(...old.map(c=>normalize({...c,id:crypto.randomUUID()})));selected=state.at(-1)?.id;save();render()}catch{alert('Lokální data nelze načíst.')}};
window.addEventListener('beforeunload',e=>{if(dirty||running){e.preventDefault();e.returnValue=''}});
function el(tag,txt,parent){let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(parent)parent.append(n);return n}function btn(t,p,fn){let b=el('button',t,p);b.onclick=fn;return b}function field(p,c,k,label,type='text'){let w=el('div',undefined,p);w.className='field';el('label',label,w);let i=el(type==='area'?'textarea':'input',undefined,w);if(type!=='area')i.type=type;i.value=c[k]??'';i.oninput=()=>{c[k]=type==='number'?Number(i.value):i.value;save();if(k==='name')people()};return i}function grid(p){let g=el('div',undefined,p);g.className='grid';return g}function people(){let p=$('people');p.replaceChildren();state.forEach(c=>{let b=btn((c.name||'Bez názvu')+(adminMode?(owners.get(c.id)===user?.id?' · moje':' · hráč'):''),p,()=>{closeLibrary();selected=c.id;tab='Profil';render()});b.className='person'+(selected===c.id?' active':'')})}function collection(p,c,k,title,valueLabel){el('h3',title,p);c[k].forEach((entry,i)=>{let r=el('div',undefined,p);r.className='line';let a=el('input',undefined,r);a.placeholder='Název';a.value=entry.name;a.oninput=()=>{entry.name=a.value;save()};let v=el('input',undefined,r);v.placeholder=valueLabel;v.value=entry.value;v.oninput=()=>{entry.value=v.value;save()};btn('−',r,()=>{c[k].splice(i,1);save();render()})});btn('+ Přidat',p,()=>{c[k].push({name:'',value:''});save();render()})}function meter(p,c,k,m,label){let w=el('div',undefined,p);el('h3',label,w);let r=el('div',undefined,w);r.className='line';btn('−',r,()=>{c[k]=Math.max(0,c[k]-1);save();render()});el('strong',`${c[k]} / ${c[m]}`,r);btn('+',r,()=>{c[k]=Math.min(c[m],c[k]+1);save();render()});let bar=el('div',undefined,w);bar.className='bar';el('div',undefined,bar).style.width=Math.max(0,Math.min(100,c[k]/Math.max(1,c[m])*100))+'%';let input=field(w,c,m,'Maximum','number');input.min=0;input.onchange=()=>{c[m]=Math.max(0,c[m]);c[k]=Math.min(c[k],c[m]);save();render()}}function inventory(p,c){el('h3','Předměty a vybavení',p);for(const [idx,item] of c.items.entries()){let card=el('section',undefined,p);card.className='rule-card';let g=grid(card);field(g,item,'name','Název');let q=field(g,item,'quantity','Počet','number');q.min=1;q.step=1;if(item.quantity==null)q.value=1;q.onchange=()=>{item.quantity=Math.max(1,Math.floor(Number(q.value)||1));q.value=item.quantity;save()};field(card,item,'value','Popis','area');if(item.category)el('small',item.category,card);if(item.equipment)displayValues(card,item.equipment);let line=el('div',undefined,card);line.className='tabs';let b=btn(item.equipped?'Sundat vybavení':'Vybavit',line,()=>{item.equipped=!item.equipped;save();render()});if(item.equipped)b.className='active';btn('Odebrat',line,()=>{if(confirm('Odebrat předmět?')){c.items.splice(idx,1);save();render()}})}btn('+ Přidat vlastní předmět',p,()=>{c.items.push({name:'',value:'',quantity:1,equipped:false});save();render()})}function render(){people();let p=$('detail');p.replaceChildren();let c=state.find(x=>x.id===selected);if(!c){el('h2',adminMode?'Žádné postavy k zobrazení':'Vytvoř svou první postavu',p);return}el('h2',c.name,p);if(adminMode)el('p','Vlastník: '+(owners.get(c.id)===user.id?'tvůj účet':owners.get(c.id)),p).className='muted';el('small',[c.race,c.role].filter(Boolean).join(' · '),p);let tabs=el('div',undefined,p);tabs.className='tabs';['Profil','Atributy','Boj','Skilly','Schopnosti','Magie','Povolání','Inventář','Deník','Kostky'].forEach(t=>{let b=btn(t,tabs,()=>{tab=t;render()});if(t===tab)b.className='active'});el('hr',undefined,p);if(tab==='Profil'){let g=grid(p);[['name','Jméno'],['race','Rasa'],['role','Zaměření'],['age','Věk'],['height','Výška']].forEach(([k,l])=>field(g,c,k,l));field(p,c,'story','Příběh a vzhled','area');if(!adminMode){let b=btn('Smazat postavu',p,()=>{if(confirm('Opravdu smazat postavu?')){state=state.filter(x=>x!==c);selected=state[0]?.id;save();render()}});b.className='danger'}}else if(tab==='Atributy'){collection(p,c,'attrs','Vlastní atributy','Hodnota')}else if(tab==='Boj'){let g=grid(p);meter(g,c,'hp','maxhp','Životy');meter(g,c,'energy','maxenergy','Energie');field(g,c,'defense','Obrana','number');field(g,c,'attack','Útok','number');field(g,c,'xp','Zkušenosti','number')}else if(tab==='Skilly')collection(p,c,'skills','Skilly','Úroveň / popis');else if(tab==='Schopnosti')collection(p,c,'abilities','Schopnosti','Efekt / popis');else if(tab==='Magie')collection(p,c,'magic','Kouzla','Efekt / náklady');else if(tab==='Povolání')collection(p,c,'jobs','Odborná povolání','Úroveň / specializace');else if(tab==='Inventář'){field(p,c,'gold','Zlaťáky','number');inventory(p,c)}else if(tab==='Deník')field(p,c,'notes','Poznámky z dobrodružství','area');else{let r=el('div',undefined,p);r.className='tabs';let out=el('h2','Vyber kostku',p);[4,6,8,10,12,20,100].forEach(n=>btn('k'+n,r,()=>{out.textContent='k'+n+': '+(1+Math.floor(Math.random()*n))}))}}$('add').onclick=()=>{if(!ready||adminMode)return;let c=fresh();state.push(c);selected=c.id;tab='Profil';save();render()};$('backup').onclick=()=>{if(adminMode)return;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='veyrath-zaloha.json';a.click();URL.revokeObjectURL(a.href)};$('import').onchange=async e=>{if(!ready||adminMode)return;try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a)||!a.every(x=>x&&typeof x.name==='string'&&['attrs','skills','abilities','magic','jobs','items'].every(k=>Array.isArray(x[k])&&x[k].every(y=>y&&typeof y.name==='string'&&typeof y.value==='string'))))throw Error();if(confirm('Přidat postavy ze zálohy jako nové kopie?')){state.push(...a.map(x=>({...fresh(),...x,id:crypto.randomUUID()})));selected=state[0]?.id;save();render()}}catch{alert('Neplatná záloha.')}e.target.value=''};const categories=['Rasy','Atributy','Skilly','Schopnosti','Magie','Odborná povolání','Zbraně','Zbroje','Předměty','Recepty','Pravidla','Herní mechaniky'];
let libraryOpen=false,libraryRows=[],libraryCategory='',librarySearch='',libraryEdit=null,libraryBusy=false,libraryEpoch=0;
function closeLibrary(){libraryEpoch++;libraryOpen=false;libraryRows=[];libraryEdit=null;libraryBusy=false;$('library').hidden=true;$('detail').hidden=false;$('libraryToggle').textContent='Knihovna pravidel';$('library').replaceChildren()}
$('libraryToggle').onclick=()=>{if(!user)return;if(libraryOpen){closeLibrary();return}libraryOpen=true;$('library').hidden=false;$('detail').hidden=true;$('libraryToggle').textContent='Zpět k deníku';fetchLibrary()};
async function fetchLibrary(){const epoch=++libraryEpoch;libraryBusy=true;libraryEdit=null;drawLibrary('Načítám knihovnu…');try{const {data,error}=await db.from('rule_library').select('*').order('name');if(error)throw error;if(epoch!==libraryEpoch)return;libraryRows=data;libraryBusy=false;drawLibrary()}catch(e){if(epoch!==libraryEpoch)return;libraryBusy=false;libraryRows=[];drawLibrary('Načtení selhalo: '+e.message)}}
function libraryField(p,label,value,area=false){let w=el('div',undefined,p);w.className='field';let l=el('label',label,w),i=el(area?'textarea':'input',undefined,l);i.value=value??'';return i}
function drawLibrary(message=''){if(!libraryOpen)return;let p=$('library');p.replaceChildren();el('h2','Knihovna Veyrath',p);el('p',isAdmin?'Správa herního obsahu · PJ':'Zveřejněný herní obsah',p).className='muted';let controls=el('div',undefined,p);controls.className='tabs';btn('Načíst znovu',controls,fetchLibrary).disabled=libraryBusy;if(isAdmin)btn('+ Nová položka',controls,()=>{libraryEdit={category:libraryCategory||categories[0],name:'',description:'',requirements:'',data:{},published:false};drawLibrary()}).disabled=libraryBusy;if(message)el('p',message,p).setAttribute('role','status');if(libraryEdit&&isAdmin){drawLibraryForm(p);return}let filters=el('div',undefined,p);filters.className='grid';let wrap=el('label','Kategorie',filters),sel=el('select',undefined,wrap);for(const cat of ['',...categories]){let o=el('option',cat||'Všechny kategorie',sel);o.value=cat}sel.value=libraryCategory;sel.onchange=()=>{libraryCategory=sel.value;drawLibrary()};let search=libraryField(filters,'Vyhledat',librarySearch);let results=el('div',undefined,p);function fill(){results.replaceChildren();let rows=libraryRows.filter(r=>(!libraryCategory||r.category===libraryCategory)&&[r.name,r.description,r.requirements].join(' ').toLocaleLowerCase('cs').includes(librarySearch.toLocaleLowerCase('cs')));if(!rows.length)el('p',libraryBusy?'Načítám…':'Žádné položky.',results);for(const r of rows){let card=el('section',undefined,results);card.className='rule-card';el('h3',r.name,card);el('small',r.category+(isAdmin?(r.published?' · Zveřejněno':' · Koncept'):''),card);if(r.description)el('p',r.description,card).className='rule-text';if(r.requirements)el('p','Požadavky: '+r.requirements,card).className='rule-text';if(r.data&&Object.keys(r.data).length)displayValues(card,r.data);let actions=el('div',undefined,card);actions.className='tabs';if(isAdmin){btn('Upravit',actions,()=>{libraryEdit={...r};drawLibrary()});btn('Smazat',actions,async()=>{if(!confirm('Opravdu odstranit položku '+r.name+'?'))return;await libraryWrite(()=>db.from('rule_library').delete().eq('id',r.id).select('id').single())})}const mapping={'Atributy':'attrs','Skilly':'skills','Schopnosti':'abilities','Magie':'magic','Odborná povolání':'jobs','Zbraně':'items','Zbroje':'items','Předměty':'items'};if(r.published&&!adminMode&&ready&&selected&&(mapping[r.category]||r.category==='Rasy'))btn('Přidat do vybrané postavy',actions,()=>{let c=state.find(x=>x.id===selected);if(!c||!ready)return;if(r.category==='Rasy'){if(!confirm('Nastavit rasu postavy '+c.name+' na '+r.name+'?'))return;c.race=r.name}else{let k=mapping[r.category];if(c[k].some(x=>x.libraryId===r.id)){alert('Položka již v deníku existuje.');return}c[k].push({name:r.name,value:r.description||'',libraryId:r.id,...(k==='items'?{equipment:{...r.data},category:r.category,quantity:1,equipped:false}: {})})}save();render();drawLibrary('Přidáno do deníku: '+c.name+' (ukládá se online).')})}}search.oninput=()=>{librarySearch=search.value;fill()};fill()}
const equipmentFields={Zbraně:{damage:'Zranění',range:'Dosah',weight:'Hmotnost',price:'Cena',properties:'Vlastnosti'},Zbroje:{protection:'Ochrana',weight:'Hmotnost',price:'Cena',properties:'Vlastnosti a omezení'},Předměty:{weight:'Hmotnost',price:'Cena',properties:'Vlastnosti a použití'}};
const valueLabels=Object.assign({},...Object.values(equipmentFields));
function displayValues(p,data){for(const [k,v] of Object.entries(data||{})){el('p',(valueLabels[k]||k)+': '+(typeof v==='object'?JSON.stringify(v):String(v)),p).className='rule-text'}}
function drawLibraryForm(p){let r=libraryEdit;let form=el('form',undefined,p);let l=el('label','Kategorie',form),cat=el('select',undefined,l);for(const s of categories){let o=el('option',s,cat);o.value=s}cat.value=r.category;let name=libraryField(form,'Název',r.name);name.required=true;let desc=libraryField(form,'Popis',r.description,true),req=libraryField(form,'Požadavky',r.requirements,true);let values={...(r.data||{})};let holder=el('div',undefined,form);let inputs=[];function capture(){for(const [k,i] of inputs){if(i.value.trim())values[k]=i.value;else delete values[k]}}function fields(){holder.replaceChildren();inputs=[];let defs=equipmentFields[cat.value]||{};if(Object.keys(defs).length)el('h3','Herní hodnoty',holder);let g=grid(holder);for(const [k,label] of Object.entries(defs)){let i=libraryField(g,label,values[k]);inputs.push([k,i])}for(const [k,v] of Object.entries(values)){if(k in defs)continue;let i=libraryField(holder,'Další hodnota: '+k,typeof v==='object'?JSON.stringify(v):v);i.readOnly=true} }fields();cat.onchange=()=>{capture();fields()};let pubLabel=el('label','',form),pub=el('input',undefined,pubLabel);pub.type='checkbox';pub.checked=r.published;pub.style.width='auto';pubLabel.append(' Zveřejnit hráčům');let msg=el('p','',form);msg.setAttribute('role','status');let buttons=el('div',undefined,form);buttons.className='tabs';let submit=el('button','Uložit položku',buttons);submit.type='submit';let cancel=btn('Zrušit',buttons,()=>{libraryEdit=null;drawLibrary()});cancel.type='button';form.onsubmit=async e=>{e.preventDefault();if(libraryBusy)return;capture();if(!name.value.trim()){msg.textContent='Vyplň název.';return}let payload={category:cat.value,name:name.value.trim(),description:desc.value,requirements:req.value,data:values,published:pub.checked};submit.disabled=cancel.disabled=true;await libraryWrite(()=>r.id?db.from('rule_library').update(payload).eq('id',r.id).select('id').single():db.from('rule_library').insert(payload).select('id').single(),msg);submit.disabled=cancel.disabled=false}}
async function libraryWrite(action,msg){if(!isAdmin||libraryBusy)return;const epoch=libraryEpoch;libraryBusy=true;try{const {error}=await action();if(error)throw error;if(epoch!==libraryEpoch)return;libraryBusy=false;await fetchLibrary()}catch(e){if(epoch!==libraryEpoch)return;libraryBusy=false;if(msg)msg.textContent='Uložení selhalo: '+e.message;else drawLibrary('Operace selhala: '+e.message)}}

render();(async()=>{if(!db){$('authmsg').textContent='Nepodařilo se načíst knihovnu Supabase.';return}try{const {data,error}=await db.auth.getSession();if(error)throw error;if(data.session)await enter(data.session.user)}catch(e){$('authmsg').textContent=e.message}})();</script></body></html>
